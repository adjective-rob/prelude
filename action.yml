name: "Prelude Context Update"
description: "Keep .context/ in sync with your code. Guard mode (check: true) fails the job when committed context has drifted; update mode (default) runs prelude update and opens a PR."

branding:
  icon: "file-text"
  color: "yellow"

inputs:
  version:
    description: "Version of prelude-context to install"
    required: false
    default: "latest"
  args:
    description: "Arguments to pass to the prelude CLI"
    required: false
    default: "update"
  working-directory:
    description: "Directory to run prelude in"
    required: false
    default: "."
  check:
    description: "Guard mode: run `prelude diff --check` and fail the job when .context/ has drifted from the code"
    required: false
    default: "false"

runs:
  using: "composite"
  steps:
    # 1. Set up Node.js
    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: "20"

    # 2. Install prelude-context
    - name: Install prelude-context
      shell: bash
      run: npm install -g prelude-context@${{ inputs.version }}

    # 3. Guard mode: fail on drift
    - name: Check context drift
      if: inputs.check == 'true'
      shell: bash
      working-directory: ${{ inputs.working-directory }}
      run: prelude diff --check

    # 4. Run prelude
    - name: Run prelude
      if: inputs.check != 'true'
      shell: bash
      working-directory: ${{ inputs.working-directory }}
      run: prelude ${{ inputs.args }}

    # 5. Check for changes in .context/
    - name: Check for .context/ changes
      if: inputs.check != 'true'
      id: changes
      shell: bash
      working-directory: ${{ inputs.working-directory }}
      run: |
        if git diff --quiet .context/; then
          echo "changed=false" >> "$GITHUB_OUTPUT"
          echo "No changes detected in .context/"
        else
          echo "changed=true" >> "$GITHUB_OUTPUT"
          echo "Changes detected in .context/"
          git diff --stat .context/
        fi

    # 6. Commit changes and open a PR
    - name: Create Pull Request
      if: inputs.check != 'true' && steps.changes.outputs.changed == 'true'
      shell: bash
      working-directory: ${{ inputs.working-directory }}
      env:
        GH_TOKEN: ${{ github.token }}
      run: |
        BRANCH="prelude/update-context-$(date +%Y%m%d-%H%M%S)"

        git config user.name "github-actions[bot]"
        git config user.email "github-actions[bot]@users.noreply.github.com"

        git checkout -b "$BRANCH"
        git add .context/
        git commit -m "chore: update .context/ via Prelude"
        git push origin "$BRANCH"

        gh pr create \
          --title "chore: update .context/ via Prelude" \
          --body "Automated update of \`.context/\` files triggered by codebase changes.

        Generated by [Prelude](https://github.com/adjective-rob/prelude)." \
          --base "${{ github.ref_name }}"
