# Automatically update .context/ files when project configuration or source code changes.
# Uses peter-evans/create-pull-request for reliable PR creation.

name: Prelude Context Update

on:
  pull_request:
  push:
    branches: [main]
    paths:
      # Dependency manifests
      - "package.json"
      - "pyproject.toml"
      - "Cargo.toml"
      - "go.mod"
      - "composer.json"
      - "Gemfile"
      # Source code
      - "src/**"
      - "lib/**"
      - "app/**"

permissions:
  contents: write
  pull-requests: write

jobs:
  # Fail pull requests whose committed .context/ has drifted from the code.
  # Builds this repo's own CLI so the check always matches the code under review.
  check-context:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: pnpm

      - name: Build prelude
        run: pnpm install --frozen-lockfile && pnpm build

      - name: Check context drift
        run: node dist/bin/prelude.js diff --check

  update-context:
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "24"

      - name: Install prelude-context
        run: npm install -g prelude-context

      - name: Run prelude update
        run: prelude update

      - name: Create Pull Request
        uses: peter-evans/create-pull-request@v7
        with:
          commit-message: "chore: update .context/ via Prelude"
          title: "chore: update .context/ via Prelude"
          body: |
            Automated update of `.context/` files triggered by codebase changes.

            Generated by [Prelude](https://github.com/adjective-rob/prelude).
          branch: prelude/update-context
          delete-branch: true
          add-paths: .context/
